<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thia & Nicole Laundry - Contact Us</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    :root { --bg:#f4f7fb; --card:#fff; --primary:#1766ff; --muted:#6b7280; }
    body{
      margin:0;
      font-family:Inter,system-ui,Arial;
      background:url('https://images.unsplash.com/photo-1696546761269-a8f9d2b80512?fm=jpg&q=60&w=3000') no-repeat center/cover fixed;
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.3);
      z-index:0;
    }
        .floating-bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(174, 200, 226, 0.416);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(31, 31, 31, 0.2);
      pointer-events: none;
      animation: floatBubble linear infinite alternate;
      z-index: 1;
    }
    .bubble1  { width:120px; height:120px; top:10%; left:8%;   animation: floatBubble 8s ease-in-out infinite; }
    .bubble2  { width:200px; height:200px; bottom:25%; left:12%; animation: floatBubble 5s ease-in-out infinite 2s;}
    .bubble3  { width:90px;  height:90px;  top:5%;  left:75%;  animation: floatBubble 6s ease-in-out infinite 2s; }
    .bubble4  { width:150px; height:150px; bottom:20%; right:20%; animation: floatBubble 10s ease-in-out infinite 4s; }
    .bubble5  { width:180px; height:180px; bottom:2%; left:8%; animation: floatBubble 7s ease-in-out infinite 4s; }
    .bubble6  { width:100px; height:100px; top:50%; right:5%;   animation: floatBubble 9s ease-in-out infinite 3s; }
    .bubble7  { width:130px; height:130px; bottom:8%; right:8%; animation: floatBubble 3s ease-in-out infinite 3s; }
    .bubble8  { width:160px; height:160px; top:38%; left:55%; animation: floatBubble 3s ease-in-out infinite 3s; }
    .bubble9  { width:110px; height:110px; top:18%; left:20%; animation: floatBubble 5s ease-in-out infinite 3s; }
    .bubble10 { width:140px; height:140px; bottom:15%; left:65%; animation: floatBubble 2s ease-in-out infinite 2s; }
    .bubble11 { width:170px; height:170px; bottom:0%; right:60%; animation: floatBubble 3s ease-in-out infinite 1s; }
    .bubble12 { width:100px; height:100px; bottom:0%; left:25%; animation: floatBubble 8s ease-in-out infinite 4s; }
    .bubble13 { width:190px; height:190px; top:4%; right:5%; animation: floatBubble 6s ease-in-out infinite 2s; }
    .bubble14 { width:80px;  height:80px;  top:60%; left:30%; animation: floatBubble 5s ease-in-out infinite 5s; }
    .bubble15 { width:150px; height:150px; bottom:90%; right:45%; animation: floatBubble 3s ease-in-out infinite 2s; }
    @keyframes floatBubble {
        0%   { transform: translateY(0) translateX(0); opacity: 0.7; }
        50%  { transform: translateY(-40px) translateX(20px); opacity: 1; }
        100% { transform: translateY(0) translateX(0); opacity: 0.7; }
    }
    .app { max-width:700px; margin:40px auto; padding:18px; position:relative; z-index:10; }
    .card {
      background:var(--card); padding:25px 20px; border-radius:12px;
      box-shadow:0 6px 18px rgba(15,23,42,0.06);
      margin-bottom:14px; overflow-y:auto;
    }
    .btn { padding:8px 12px; border-radius:8px; background:var(--primary); color:#fff; border:none; cursor:pointer; font-size:14px; }
    .btn.alt { background:#eef2ff; color:var(--primary); }
    .form-group{margin-bottom:15px; margin: 20px;}
    .form-group label{display:block;margin-bottom:5px;font-weight:500}
    .form-group input,.form-group textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px}
    .replies {
      margin-top: 20px;
      background: #f0f4ff;
      padding: 15px;
      border-radius: 8px;
    }
    .reply-card {
      border-left: 4px solid #1766ff;
      background: #fff;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
    <!-- bubbles -->
  <div class="floating-bubble bubble1"></div><div class="floating-bubble bubble2"></div>
  <div class="floating-bubble bubble3"></div><div class="floating-bubble bubble4"></div>
  <div class="floating-bubble bubble5"></div><div class="floating-bubble bubble6"></div>
  <div class="floating-bubble bubble7"></div><div class="floating-bubble bubble8"></div>
  <div class="floating-bubble bubble9"></div><div class="floating-bubble bubble10"></div>
  <div class="floating-bubble bubble11"></div><div class="floating-bubble bubble12"></div>
  <div class="floating-bubble bubble13"></div><div class="floating-bubble bubble14"></div>
  <div class="floating-bubble bubble15"></div>
  <div class="app">
    <div class="card">
      <h2><i class="fas fa-envelope"></i> Contact Us</h2>
      <form id="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn">Send Message</button>
      </form>

      <div style="margin-top:14px">
        <button class="btn alt" onclick="location.href='home.html'"><i class="fas fa-arrow-left"></i> Back to Home</button>
      </div>
    </div>

    <!-- User Inbox Section -->
    <div class="card">
      <h3><i class="fas fa-inbox"></i> My Messages</h3>
      <div id="user-messages"></div>
    </div>
  </div>

  <script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('contact-form');
  const msgList = document.getElementById('user-messages');
  const emailInput = document.getElementById('email');

  const loadUserMessages = () => {
    const messages = JSON.parse(localStorage.getItem('messages')) || [];
    const email = emailInput.value.trim();

    if (!email) {
      msgList.innerHTML = '<p style="color:gray;">Enter your email above to view your messages and replies.</p>';
      return;
    }

    const userMsgs = messages.filter(m => m.email === email);
    if (userMsgs.length === 0) {
      msgList.innerHTML = '<p>No messages found for this email.</p>';
      return;
    }

    msgList.innerHTML = userMsgs.map(m => `
      <div class="reply-card">
        <p><strong>You:</strong> ${m.message}</p>
        <small>Sent: ${new Date(m.created_at).toLocaleString()}</small>
        ${m.reply ? `
          <div class="replies">
            <strong>Admin Reply:</strong>
            <p>${m.reply}</p>
          </div>` : `<p style="color:#999;"><i>No reply yet</i></p>`}
      </div>
    `).join('');
  };

  // Send new message
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = emailInput.value.trim();
    const message = document.getElementById('message').value.trim();

    if (!name || !email || !message) {
      alert('Please fill all fields');
      return;
    }

    const newMessage = {
      id: Date.now(),
      name,
      email,
      message,
      status: 'unread',
      created_at: new Date().toISOString()
    };

    const messages = JSON.parse(localStorage.getItem('messages')) || [];
    messages.push(newMessage);
    localStorage.setItem('messages', JSON.stringify(messages));

    alert('Message sent successfully!');

    // reset only name and message, NOT email
    document.getElementById('name').value = '';
    document.getElementById('message').value = '';

    // reload messages
    loadUserMessages();
  });

  // When user enters email, load their inbox
  emailInput.addEventListener('input', loadUserMessages);

  loadUserMessages();
});
</script>

</body>
</html>
