<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thia & Nicole Laundry - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="toast.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #fff;
      --primary: #1766ff;
      --muted: #6b7280;
      --danger: #dc2626;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family:Inter,system-ui,Arial;
      background:url('https://images.unsplash.com/photo-1696546761269-a8f9d2b80512?fm=jpg&q=60&w=3000') no-repeat center/cover fixed;
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.3);
      z-index:0;
    }
    .app{max-width:480px;margin:50px auto;position:relative;z-index:10;}
    .card{
      background:rgba(255,255,255,0.95);
      backdrop-filter:blur(15px);
      border-radius:20px;
      box-shadow:0 10px 40px rgba(0,0,0,0.3);
      padding:35px;
      position:absolute;top:0;left:0;width:100%;
      opacity:0;transform:translateX(120%);
      transition:all .6s ease;
    }
    .floating-bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(174, 200, 226, 0.416);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(31, 31, 31, 0.2);
      pointer-events: none;
      animation: floatBubble linear infinite alternate;
      z-index: 1;
    }
    .bubble1  { width:120px; height:120px; top:10%; left:8%;   animation: floatBubble 8s ease-in-out infinite; }
    .bubble2  { width:200px; height:200px; bottom:25%; left:12%; animation: floatBubble 5s ease-in-out infinite 2s;}
    .bubble3  { width:90px;  height:90px;  top:5%;  left:75%;  animation: floatBubble 6s ease-in-out infinite 2s; }
    .bubble4  { width:150px; height:150px; bottom:20%; right:20%; animation: floatBubble 10s ease-in-out infinite 4s; }
    .bubble5  { width:180px; height:180px; bottom:2%; left:8%; animation: floatBubble 7s ease-in-out infinite 4s; }
    .bubble6  { width:100px; height:100px; top:50%; right:5%;   animation: floatBubble 9s ease-in-out infinite 3s; }
    .bubble7  { width:130px; height:130px; bottom:8%; right:8%; animation: floatBubble 3s ease-in-out infinite 3s; }
    .bubble8  { width:160px; height:160px; top:38%; left:55%; animation: floatBubble 3s ease-in-out infinite 3s; }
    .bubble9  { width:110px; height:110px; top:18%; left:20%; animation: floatBubble 5s ease-in-out infinite 3s; }
    .bubble10 { width:140px; height:140px; bottom:15%; left:65%; animation: floatBubble 2s ease-in-out infinite 2s; }
    .bubble11 { width:170px; height:170px; bottom:0%; right:60%; animation: floatBubble 3s ease-in-out infinite 1s; }
    .bubble12 { width:100px; height:100px; bottom:0%; left:25%; animation: floatBubble 8s ease-in-out infinite 4s; }
    .bubble13 { width:190px; height:190px; top:4%; right:5%; animation: floatBubble 6s ease-in-out infinite 2s; }
    .bubble14 { width:80px;  height:80px;  top:60%; left:30%; animation: floatBubble 5s ease-in-out infinite 5s; }
    .bubble15 { width:150px; height:150px; bottom:90%; right:45%; animation: floatBubble 3s ease-in-out infinite 2s; }
    @keyframes floatBubble {
        0%   { transform: translateY(0) translateX(0); opacity: 0.7; }
        50%  { transform: translateY(-40px) translateX(20px); opacity: 1; }
        100% { transform: translateY(0) translateX(0); opacity: 0.7; }
    }
    .card.active{opacity:1;transform:translateX(0);z-index:2;}
    h2{text-align:center;margin-bottom:20px;}
    .field{margin-bottom:15px;}
    .field label{font-size:14px;color:#333;}
    .field input{width:100%;padding:12px 15px;border:2px solid #ddd;border-radius:10px;}
    .field input:focus{border-color:var(--primary);outline:none;}
    .btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;margin-top:10px;}
    .btn.alt{background:transparent;color:var(--primary);border:2px solid var(--primary);}
  </style>
</head>
<body>
  <!-- bubbles -->
  <div class="floating-bubble bubble1"></div><div class="floating-bubble bubble2"></div>
  <div class="floating-bubble bubble3"></div><div class="floating-bubble bubble4"></div>
  <div class="floating-bubble bubble5"></div><div class="floating-bubble bubble6"></div>
  <div class="floating-bubble bubble7"></div><div class="floating-bubble bubble8"></div>
  <div class="floating-bubble bubble9"></div><div class="floating-bubble bubble10"></div>
  <div class="floating-bubble bubble11"></div><div class="floating-bubble bubble12"></div>
  <div class="floating-bubble bubble13"></div><div class="floating-bubble bubble14"></div>
  <div class="floating-bubble bubble15"></div>

  <div class="app">
    <!-- SIGN IN -->
    <div id="signin-screen" class="card active">
      <h2>Sign In</h2>
      <div class="field"><label>Email</label><input id="signin-email" type="email" placeholder="email@gmail.com"></div>
      <div class="field"><label>Password</label><input id="signin-password" type="password" placeholder="Password"></div>
      <button class="btn" id="signin-btn">Login</button>
      <button class="btn alt" id="show-create">Create Account</button>
    </div>

    <!-- CREATE ACCOUNT -->
    <div id="create-screen" class="card">
      <h2>Create Account</h2>
      <div class="field"><label>First name</label><input id="first-name" placeholder="Juan"></div>
      <div class="field"><label>Last name</label><input id="last-name" placeholder="Dela Cruz"></div>
      <div class="field"><label>Email</label><input id="create-email" type="email" placeholder="email@gmail.com"></div>
      <div class="field"><label>Password</label><input id="create-password" type="password" placeholder="Password"></div>
      <div class="field"><label>Re-enter Password</label><input id="re-password" type="password" placeholder="Re-enter Password"></div>
      <div class="field"><label>Mobile #</label><input id="contact" placeholder="Enter contact number"></div>
      <div class="field"><label>Address (Optional)</label><input id="address" placeholder="Enter address"></div>
      <button class="btn" id="create-btn">Create & Login</button>
      <button class="btn alt" id="back-btn">Back</button>
    </div>
  </div>

<script src="toast.js"></script>
<script>
const LS_USERS = 'tn_accounts_v2';
const LS_CURR = 'tn_current_v1';
const HARD_ADMIN = {
  email: 'admin@laundry.com',
  password: btoa('Admin123!'),
  name: 'Administrator',
  role: 'admin',
  contact: 'N/A',
  address: 'N/A'
};

// Utility functions
function getUsers() {
  let users = [];
  try {
    users = JSON.parse(localStorage.getItem(LS_USERS)) || [];
  } catch {
    users = [];
  }
  // Always include admin
  if (!users.some(u => u.email === HARD_ADMIN.email)) {
    users.push(HARD_ADMIN);
    localStorage.setItem(LS_USERS, JSON.stringify(users));
  }
  return users;
}

function saveUsers(users) {
  localStorage.setItem(LS_USERS, JSON.stringify(users));
}

function showToast(msg, type='info') {
  if (typeof window.showToastLib === 'function') showToastLib(msg, type);
  else alert(msg);
}

// screen switching
const signin = document.getElementById('signin-screen');
const create = document.getElementById('create-screen');
document.getElementById('show-create').onclick = () => {
  signin.classList.remove('active');
  create.classList.add('active');
};
document.getElementById('back-btn').onclick = () => {
  create.classList.remove('active');
  signin.classList.add('active');
};

// LOGIN
document.getElementById('signin-btn').onclick = () => {
  const e = document.getElementById('signin-email').value.trim();
  const p = document.getElementById('signin-password').value.trim();
  if (!e || !p) { showToast('Enter email & password','error'); return; }

  const users = getUsers();
  // FIXED: check for both encoded or plain passwords
  const found = users.find(u => 
    u.email === e && (u.password === btoa(p) || u.password === p)
  );

  if (!found) {
    showToast('Invalid login','error');
    return;
  }

  localStorage.setItem(LS_CURR, JSON.stringify(found));
  showToast('Login success','success');
  setTimeout(() => { location.href = 'home.html'; }, 800);
};

// CREATE ACCOUNT
document.getElementById('create-btn').onclick = () => {
  const f = document.getElementById('first-name').value.trim(),
        l = document.getElementById('last-name').value.trim(),
        e = document.getElementById('create-email').value.trim(),
        p = document.getElementById('create-password').value.trim(),
        rp = document.getElementById('re-password').value.trim(),
        c = document.getElementById('contact').value.trim(),
        a = document.getElementById('address').value.trim();

  if (!f || !l || !e || !p || !rp) {
    showToast('Fill all fields','error');
    return;
  }
  if (p !== rp) {
    showToast('Passwords do not match','error');
    return;
  }

  let users = getUsers();
  if (users.some(u => u.email === e)) {
    showToast('Email already used','error');
    return;
  }

  users.push({
    email: e,
    password: btoa(p),
    name: `${f} ${l}`,
    role: 'customer',
    contact: c,
    address: a
  });
  saveUsers(users);

  showToast('Account created! You can now log in.','success');
  setTimeout(() => {
    create.classList.remove('active');
    signin.classList.add('active');
  }, 1000);
};
</script>
</body>
</html>
