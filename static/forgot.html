<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thia & Nicole Laundry - Forgot Password</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  :root {
    --bg: #f4f7fb;
    --card: #fff;
    --primary: #1766ff;
    --muted: #6b7280;
    --error: #e74c3c;
    --success: #2ecc71;
  }

  body {
    margin: 0;
    font-family: Inter, system-ui, Arial;
    background: url('https://images.unsplash.com/photo-1696546761269-a8f9d2b80512?fm=jpg&q=60&w=3000') no-repeat center center/cover fixed;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
  }

  .app {
    position: relative;
    z-index: 5;
    max-width: 380px;
    margin: 8vh auto;
    background: var(--card);
    border-radius: 12px;
    padding: 25px 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  }

  h2 {
    text-align: center;
    color: #111;
    margin-bottom: 5px;
  }
  p {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 20px;
  }

  label { font-size: 14px; color: #333; margin-bottom: 4px; display: block; }
  input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    margin-bottom: 10px;
    box-sizing: border-box;
  }

  .error-text {
    color: var(--error);
    font-size: 13px;
    margin-bottom: 10px;
    display: none;
  }

  .btn {
    display: inline-block;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    font-size: 15px;
  }
  .btn.alt {
    background: #eef2ff;
    color: var(--primary);
    margin-top: 8px;
  }

  .hidden { display: none; }

  .password-field-wrapper {
    position: relative;
  }
  .password-field-wrapper input {
    padding-right: 40px;
  }
  .toggle-password {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: var(--muted);
  }

  .success-message {
    text-align: center;
    color: var(--success);
    font-weight: 500;
    font-size: 15px;
    margin: 15px 0;
  }
</style>
</head>
<body>

<div class="app">

  <!-- STEP 1 -->
  <div id="step1">
    <h2>Forgot Password</h2>
    <p>Enter your registered email address to reset your password.</p>
    <label>Email Address</label>
    <input id="forgot-email" type="email" placeholder="email@example.com">
    <div id="email-error" class="error-text"></div>
    <button class="btn" id="check-email">Continue</button>
    <button class="btn alt" onclick="location.href='auth.html'">Back to Login</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="hidden">
    <h2>Reset Password</h2>
    <p>Set a new password for <span id="reset-email"></span></p>

    <label>New Password</label>
    <div class="password-field-wrapper">
      <input id="new-pass" type="password" placeholder="Enter new password">
      <i class="toggle-password fas fa-eye"></i>
    </div>
    <div id="pass-error" class="error-text"></div>

    <button class="btn" id="save-pass">Save Password</button>
  </div>

  <!-- STEP 3 -->
  <div id="step3" class="hidden">
    <h2>Password Updated</h2>
    <div class="success-message">Your password has been changed successfully.</div>
    <button class="btn" onclick="location.href='auth.html'">Return to Login</button>
  </div>

</div>

<script>
const LS_USERS = 'tn_accounts_v2';
function getUsers(){return JSON.parse(localStorage.getItem(LS_USERS)||'[]');}
function saveUsers(arr){localStorage.setItem(LS_USERS,JSON.stringify(arr));}

// Password visibility toggle
document.querySelectorAll('.toggle-password').forEach(icon => {
  icon.addEventListener('click', () => {
    const input = icon.previousElementSibling;
    input.type = input.type === 'password' ? 'text' : 'password';
    icon.classList.toggle('fa-eye');
    icon.classList.toggle('fa-eye-slash');
  });
});

// STEP 1
document.getElementById('check-email').onclick = ()=>{
  const email = document.getElementById('forgot-email').value.trim();
  const error = document.getElementById('email-error');
  error.style.display = 'none';

  if(!email){
    error.textContent = "Please enter your email address.";
    error.style.display = 'block';
    return;
  }

  const users = getUsers();
  const user = users.find(u=>u.email===email);
  if(!user){
    error.textContent = "No account found with this email.";
    error.style.display = 'block';
    return;
  }

  document.getElementById('reset-email').textContent = email;
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
};

// STEP 2
document.getElementById('save-pass').onclick = ()=>{
  const pass = document.getElementById('new-pass').value.trim();
  const email = document.getElementById('reset-email').textContent;
  const error = document.getElementById('pass-error');
  error.style.display = 'none';

  const pattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{8,15}$/;
  if(!pass){
    error.textContent = "Please enter a new password.";
    error.style.display = 'block';
    return;
  }
  if(!pattern.test(pass)){
    error.textContent = "Password must be 8–15 chars with uppercase, lowercase & special char.";
    error.style.display = 'block';
    return;
  }

  const users = getUsers();
  const idx = users.findIndex(u=>u.email===email);
  if(idx===-1){
    error.textContent = "Something went wrong. Try again.";
    error.style.display = 'block';
    return;
  }

  users[idx].password = btoa(pass);
  saveUsers(users);

  document.getElementById('step2').classList.add('hidden');
  document.getElementById('step3').classList.remove('hidden');
};
</script>
</body>
</html>
